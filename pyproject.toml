[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmbagent"
version = "0.1.0"
description = "Lithium Metal Battery Data Analysis Agent"
requires-python = ">=3.12"
dependencies = [
    "cellpy",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "markdown",
    "claude-agent-sdk",
    "litellm>=1.0",
    "python-dotenv",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
]
pdf = [
    "weasyprint",
]

[project.scripts]
lmbagent = "lmbagent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
